name: Gitline scan

# Runs the scanner on a schedule and commits redacted results into data/,
# which the static dashboard reads. This is what makes Gitline keep working
# when nobody has the page open.

on:
  schedule:
    # Every 15 minutes. GitHub queues scheduled runs under load, so treat the
    # interval as a floor rather than a guarantee.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      owner:
        description: "Scan only this user/org (leave blank for the configured modes)"
        required: false
        type: string

# Never let two runs interleave: they share data/state.json, and a cancelled
# run mid-write would leave the discovery cursor inconsistent.
concurrency:
  group: gitline-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # A PAT here means the resulting commit can trigger the Pages build.
          # Pushes authenticated with GITHUB_TOKEN deliberately do not trigger
          # further workflow runs, which includes pages-build-deployment.
          token: ${{ secrets.GITLINE_TOKEN || secrets.TRIPLINE_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scan
        env:
          # A PAT gets 5,000 requests/hour. The default GITHUB_TOKEN is capped
          # at 1,000/hour per repository, which is enough to try this out but
          # will limit how many repos each run gets through.
          GITLINE_TOKEN: ${{ secrets.GITLINE_TOKEN }}
          # Pre-rename secret name, still honoured.
          TRIPLINE_TOKEN: ${{ secrets.TRIPLINE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.owner }}" ]; then
            node worker/run.js --owner "${{ inputs.owner }}"
          else
            node worker/run.js
          fi

      - name: Commit results
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No change in data/ — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: scan results $(date -u +%Y-%m-%dT%H:%MZ)"
          # Another run may have landed while this one was scanning.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          for attempt in 1 2 3 4; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push failed, retrying in $((attempt * 2))s"
            sleep $((attempt * 2))
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          done
          exit 1
